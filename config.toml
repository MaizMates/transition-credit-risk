[run]
countries = ["IT", "DE"]
base_year = 2025
end_year = 2050
reference_iam = "GCAM 6.0 NGFS"   # finest native region containing IT and DE (EU-15)
reference_scenario = "Current Policies"
chart_scenarios = ["Net Zero 2050", "Delayed transition", "Current Policies"]
pass_through = 0.0                # share of carbon cost passed on to prices
k_repl = 0.0                      # abatement capex per tonne; OP 281 value not traceable, channel off
lgd = 0.40                        # F-IRB senior unsecured corporates, Art. 161(1) CRR as amended by Reg. (EU) 2024/1623
unpriced_sectors = []            # IAM sectors exempt from the carbon price (e.g. "AFOLU")
v_over_d = 1.0                    # representative-firm mode: level absorbed by calibration

[conversion]                      # US$2010 -> EUR at 2023 prices
usd_per_eur_2010 = 1.3257166666667  # ECB EXR.A.USD.EUR.SP00.A, 2010
deflator_2010 = 94.258              # Eurostat nama_10_gdp PD15_EUR B1GQ EA20
deflator_base = 122.348             # same series, 2023

[sensitivity]
pass_through = [0.5]
sigma_scale = [0.8, 1.2]
unpriced_sectors = ["AFOLU"]
iams = ["MESSAGEix-GLOBIOM 2.0-M-R12-NGFS", "REMIND-MAgPIE 3.3-4.8"]
